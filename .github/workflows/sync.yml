# キャラ対の Discord → Notion 転記を GitHub Actions で動かす。
# - ふだんの5分ごとの起動は、GAS のタイマー（timer.gs）がこのワークフローを呼ぶ（timer = true）。
#   GitHub 自身の定期実行は遅れたり飛ばされたりしやすく、5分ごとにしても4時間半で2回しか動かなかった（2026-10-06）ので、下の schedule は予備
# - 5分ごと（タイマーと、予備の5分枠）は公開リポジトリのときだけ動く。非公開だと無料枠（月2,000分）に収まらないため、30分枠だけになる
# - 自動の実行（タイマー・定期実行）は、リポジトリ変数 SYNC_ENABLED が true のときだけ。手動実行はいつでも動く
#   （値の前後の空白や大文字小文字は気にしない。「 true」と空白入りで登録されていたことがある＝2026-10-06）
# - 手動実行（Actions → キャラ対転記 → Run workflow）で checkSetup / sync / rescanCovers を選べる
# - 進み具合は state/state.json に保存して、このリポジトリにコミットする（トークンは保存しない）
name: キャラ対転記

on:
  schedule:
    # 予備: 非公開でも動く枠（30分ごと）
    - cron: '7,37 * * * *'
    # 予備: 公開リポジトリのときだけ動く枠（上と合わせて5分ごと）。毎時0分はGitHubが混むので外す
    - cron: '2,12,17,22,27,32,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      task:
        description: '実行するもの'
        type: choice
        options: [checkSetup, sync, rescanCovers]
        default: checkSetup
      timer:
        description: 'GASのタイマーからの自動実行（手で実行するときはチェックしない）'
        type: boolean
        default: false

# 同時に2つ動かない（進み具合が食い違わないように）
concurrency:
  group: kyaratai-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    # 飛ばした回は無料枠を使わない
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.timer) ||
      (contains(vars.SYNC_ENABLED, 'true') &&
       (github.event.schedule == '7,37 * * * *' || github.event.repository.private == false))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 設定の確認
        run: |
          echo "自動転記（変数 SYNC_ENABLED）: ${{ contains(vars.SYNC_ENABLED, 'true') && 'オン' || format('オフ（今の値: 「{0}」。自動にするには true）', vars.SYNC_ENABLED) }}"
          echo "リポジトリ: ${{ github.event.repository.private == false && '公開（5分ごと）' || '非公開（30分ごと）' }}"
          echo "起動: ${{ inputs.timer && 'GASのタイマー' || github.event_name }}"
      - name: 実行
        run: node runner/run.js "${{ inputs.task || 'sync' }}"
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_URL: ${{ secrets.NOTION_URL }}
      - name: 進み具合を保存
        if: always()
        run: |
          # 公開リポジトリは60日間コミットが無いと定期実行が止められるので、
          # 投稿が無い時期が続いても45日ごとに日付を書いてコミットする
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 24 * 3600 )) ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > state/keepalive.txt
          fi
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "kyaratai-sync"
            git config user.email "kyaratai-sync@users.noreply.github.com"
            git add state
            git commit -m "進み具合を更新"
            git pull --rebase
            git push
          fi
